name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.1"
      - name: start managed PostgreSQL
        run: |
          docker compose -p jobcron-local -f deploy/local/compose.yaml up -d --wait
          database="jobcron_ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          docker exec jobcron-local-postgres-1 createdb -U postgres "$database"
          echo "JOBCRON_CI_DATABASE=$database" >>"$GITHUB_ENV"
          echo "JOBCRON_TEST_POSTGRES_URL=postgres://postgres@127.0.0.1:55432/$database?sslmode=disable" >>"$GITHUB_ENV"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - name: build shipped commands
        run: go build ./cmd/jobcron ./cmd/jobcron-import ./cmd/jobcron-user
      - name: release archive contract
        run: go test ./scripts -run TestReleaseConfigPackagesImporter -count=1
      - name: production image publication contract
        run: sh scripts/check-production-image-workflow_test.sh
      - name: Terraform Slice 4 saved-plan contract
        run: sh scripts/check-terraform-slice-4-plan_test.sh
      - name: production transient runtime contract
        run: |
          sh -n deploy/production/jobcron-runtime.sh
          go test ./scripts -run 'TestJobcron(Systemd|Runtime)' -count=1
      - name: production private operations contract
        run: |
          sh -n scripts/production-rds-role.sh
          sh -n scripts/pull-production-recovery.sh
          go test ./scripts -run 'TestProductionPrivateOps' -count=1
      - name: production Compose contract
        env:
          JOBCRON_IMAGE: ghcr.io/example-owner/jobcron@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          DATABASE_URL: postgres://synthetic:synthetic@db.example.invalid/jobcron?sslmode=require
          SESSION_SECRET: synthetic-session-secret-at-least-32-bytes
          JOBCRON_CREDENTIAL_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          JOBCRON_PROXY_SECRET: synthetic-proxy-secret
          JOBCRON_DAILY_SCRAPE_TIME: "06:15"
          JOBCRON_SIGNUP_ACCESS_CODE: synthetic-cohort-code
          JOBCRON_STAGE1_SPONSOR_USER_ID: "42"
        run: |
          sh -n scripts/verify-production-compose.sh
          sh -n scripts/inspect-production-compose-render.sh
          go test ./scripts -run ProductionCompose -count=1
          sh scripts/verify-production-compose.sh
      - name: local PostgreSQL Compose contract
        run: go test ./internal/localdb -run 'Test(ComposeContract|DecodedComposeEqualityDetectsUnmodeledDrift)$' -count=1
      - name: importer PostgreSQL integration tests
        run: go test ./cmd/jobcron-import -count=1
      - name: preview isolation, cleanup, and locking contracts
        run: go test ./scripts -run Preview -count=1
      - name: full test suite
        run: go test ./... -count=1
      - name: full race suite
        run: go test -race ./... -count=1
      - name: cross-compile arm64 targets
        run: |
          GOOS=linux GOARCH=arm64 go build ./cmd/jobcron
          GOOS=linux GOARCH=arm64 go build ./cmd/jobcron-import
          GOOS=darwin GOARCH=arm64 go build ./cmd/jobcron
          GOOS=darwin GOARCH=arm64 go build ./cmd/jobcron-import
      - name: verify PostgreSQL test cleanup
        if: always()
        run: |
          status=0
          preview_databases=$(docker exec jobcron-local-postgres-1 \
            psql -U postgres -d postgres -Atqc \
            "SELECT datname FROM pg_database WHERE datname LIKE 'jobcron_preview_%'")
          if [ -n "$preview_databases" ]; then
            echo "Preview databases remained after the test suite:"
            echo "$preview_databases"
            status=1
          fi

          lock_root="/tmp/jobcron-preview-locks-$(id -u)"
          if [ -d "$lock_root" ] && find "$lock_root" -mindepth 1 -print -quit | grep -q .; then
            echo "Preview locks remained after the test suite:"
            find "$lock_root" -mindepth 1 -maxdepth 1 -print
            status=1
          fi

          if [ -n "${JOBCRON_CI_DATABASE:-}" ]; then
            docker exec jobcron-local-postgres-1 \
              dropdb --force -U postgres --if-exists "$JOBCRON_CI_DATABASE"
          fi
          exit "$status"

  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go run ./cmd/jobcron --version
