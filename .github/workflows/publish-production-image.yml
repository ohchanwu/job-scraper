name: Publish production image

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Validate and check out release commit
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'Invalid release commit\n' >&2
            exit 1
          fi
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git checkout --detach "$RELEASE_SHA"

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@b396b4ae3ea16a9e6faca67ecb36b5b12ce135a2

      - name: Publish immutable private image
        shell: bash
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          umask 077

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/jobcron:sha-${RELEASE_SHA:0:12}"
          build_log="$(mktemp "${RUNNER_TEMP}/jobcron-build.XXXXXX")"
          metadata_file="$(mktemp "${RUNNER_TEMP}/jobcron-metadata.XXXXXX")"
          package_response="$(mktemp "${RUNNER_TEMP}/jobcron-package.XXXXXX")"
          trap 'rm -f "$build_log" "$metadata_file" "$package_response"' EXIT
          chmod 600 "$build_log" "$metadata_file"

          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GHCR_USER" --password-stdin >/dev/null 2>&1

          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            printf 'Immutable image tag already exists\n' >&2
            exit 1
          fi

          if ! docker buildx build --platform linux/arm64 \
            --file deploy/production/Dockerfile \
            --tag "$image" --metadata-file "$metadata_file" --push . >"$build_log" 2>&1; then
            printf 'Image publication failed\n' >&2
            exit 1
          fi
          printf 'Image publication succeeded\n'

          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GHCR_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$package_response" \
            "https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/jobcron"
          jq -e '.visibility == "private"' "$package_response" >/dev/null

          {
          echo "Commit: ${RELEASE_SHA}"
          echo "Platform: linux/arm64"
          echo "Visibility: private"
          } >>"$GITHUB_STEP_SUMMARY"
