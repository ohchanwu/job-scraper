# Production deployment stack for https://jobcron.app.
#
# This compose file intentionally differs from deploy/demo:
# - pulls a prebuilt image instead of building on EC2
# - uses AWS RDS PostgreSQL through DATABASE_URL
# - runs the private owner-login app, not read-only demo mode
# - leaves Worknet disabled for the first pass
services:
  app:
    image: "${JOBCRON_IMAGE:?set JOBCRON_IMAGE in .env}"
    pull_policy: never
    command:
      - --no-open
      - --host
      - 0.0.0.0
      - --port
      - "7777"
    environment:
      JOBCRON_ENV: production
      JOBCRON_HOST: 0.0.0.0
      JOBCRON_PORT: "7777"
      JOBCRON_NO_OPEN: "1"
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in .env}"
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET in .env}"
      JOBCRON_CREDENTIAL_ENCRYPTION_KEY: >-
        ${JOBCRON_CREDENTIAL_ENCRYPTION_KEY:?set JOBCRON_CREDENTIAL_ENCRYPTION_KEY in .env}
      JOBCRON_SCHEDULER_ENABLED: "1"
      JOBCRON_DAILY_SCRAPE_TIME: "${JOBCRON_DAILY_SCRAPE_TIME:-05:00}"
      JOBCRON_SIGNUP_ACCESS_CODE: >-
        ${JOBCRON_SIGNUP_ACCESS_CODE:?set JOBCRON_SIGNUP_ACCESS_CODE in .env}
      JOBCRON_STAGE1_SPONSOR_USER_ID: >-
        ${JOBCRON_STAGE1_SPONSOR_USER_ID:?set JOBCRON_STAGE1_SPONSOR_USER_ID in .env}
      JOBCRON_PROXY_SECRET: "${JOBCRON_PROXY_SECRET:?set JOBCRON_PROXY_SECRET in .env}"
      AWS_EC2_METADATA_DISABLED: "true"
    ports:
      - target: 7777
        published: "7777"
        host_ip: 127.0.0.1
        protocol: tcp
    expose:
      - "7777"
    networks:
      - runtime
      - outbound
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - app
    ports:
      - target: 443
        published: "8443"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      JOBCRON_PROXY_SECRET: "${JOBCRON_PROXY_SECRET:?set JOBCRON_PROXY_SECRET in .env}"
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /run/jobcron/caddy:/run/jobcron/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - runtime
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

networks:
  runtime:
    internal: true
  outbound:
    driver: bridge
